name: CD — Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-build.txt

      - name: Create .env from secrets
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > backend/.env
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller OpenGuardian.spec --clean --noconfirm
        shell: bash

      - name: Package dist zip
        shell: powershell
        run: |
          Compress-Archive -Path dist/OpenGuardian -DestinationPath OpenGuardian.zip
          Write-Host "打包完成: $((Get-Item OpenGuardian.zip).Length / 1MB) MB"
          Get-ChildItem OpenGuardian.zip | Select-Object Name, Length

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: OpenGuardian.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
