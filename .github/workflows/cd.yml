name: CD — Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-build.txt

      - name: Create .env placeholder
        shell: bash
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > backend/.env
          if [ -z "$(cat backend/.env | grep -o 'sk-')" ]; then
            echo "DEEPSEEK_API_KEY=ci-placeholder" > backend/.env
          fi

      - name: PyInstaller build
        run: pyinstaller OpenGuardian.spec --clean --noconfirm

      - name: Zip for release
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE "dist\OpenGuardian"
          Write-Host "Source: $src"
          Get-ChildItem $src | Select-Object -First 10
          Compress-Archive -Path $src -DestinationPath OpenGuardian.zip
          Write-Host "Zipped: $((Get-Item OpenGuardian.zip).Length / 1MB) MB"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: OpenGuardian.zip
          generate_release_notes: true
