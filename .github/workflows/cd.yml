name: CD — Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-build.txt

      # 打包需要 backend/.env（真实 Key 存 GitHub Secrets，不进仓库）
      - name: Create .env from secrets
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > backend/.env
          if [ ! -s backend/.env ] || grep -q "DEEPSEEK_API_KEY=$" backend/.env; then
            echo "::warning::DEEPSEEK_API_KEY secret 未配置，使用占位符"
            echo "DEEPSEEK_API_KEY=ci-placeholder-key" > backend/.env
          fi
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller OpenGuardian.spec --clean --noconfirm
        shell: bash

      - name: Install Inno Setup (winget)
        shell: powershell
        run: |
          winget install --accept-package-agreements --accept-source-agreements --silent JRSoftware.InnoSetup
          Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -ExpandProperty FullName

      - name: Compile Installer (ISCC)
        shell: powershell
        run: |
          # 诊断环境
          Write-Host "== CWD =="
          Get-Location
          Write-Host "== dist 内容 =="
          Get-ChildItem dist -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem dist/OpenGuardian -ErrorAction SilentlyContinue | Select-Object -First 5 Name
          Write-Host "== ico =="
          Test-Path OpenGuardian.ico

          $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) {
            Write-Host "::error::ISCC not found in C:\Program Files (x86)"
            exit 1
          }
          Write-Host "Using ISCC: $iscc"

          # 直接运行，不用管道（避免 $LASTEXITCODE 问题），输出全量到日志
          & $iscc setup.iss
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::ISCC failed with exit code $code"
            exit $code
          }
          Write-Host "::notice::ISCC 编译成功"
          Get-ChildItem OpenGuardian-*-Setup.exe | Select-Object Name, Length

      - name: Upload ISCC log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iscc-log
          path: iscc.log
          if-no-files-found: ignore

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: OpenGuardian-*-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
