name: CD — Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      # 打包需要 backend/.env（真实 Key 存 GitHub Secrets，不进仓库）
      - name: Create .env from secrets
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > backend/.env
          if [ ! -s backend/.env ] || grep -q "DEEPSEEK_API_KEY=$" backend/.env; then
            echo "::warning::DEEPSEEK_API_KEY secret 未配置，构建将使用占位符"
            echo "DEEPSEEK_API_KEY=ci-placeholder-key" > backend/.env
          fi
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller OpenGuardian.spec --clean --noconfirm

      - name: Install Inno Setup
        shell: powershell
        run: |
          $installer = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -ExpandProperty FullName

      - name: Compile Installer (ISCC)
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName
          }
          Write-Host "Using ISCC: $iscc"
          & $iscc setup.iss 2>&1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== ISCC 输出 ==="
            $out | Select-Object -Last 40
            exit $LASTEXITCODE
          }
          Get-ChildItem OpenGuardian-*-Setup.exe | Select-Object Name, Length

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: OpenGuardian-*-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
