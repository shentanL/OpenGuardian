name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify frontend files
        run: |
          node --check frontend/app.js
          node --check frontend/config.js
          node --check frontend/notifications.js
          node --check frontend/background.js

      - name: Verify Python syntax
        run: |
          python -m py_compile backend/app/main.py
          python -m py_compile backend/app/db.py
          python -m py_compile backend/app/config.py

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ruff lint
        run: |
          pip install ruff
          ruff check backend/app/ --ignore=E501,E402,F401,F841 --select=E,F,W
