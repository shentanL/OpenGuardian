<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenGuardian · AI 数字安全平台</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/icons.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <button id="new-session" class="new-session"><svg class="ic"><use href="#ic-plus"/></svg>新建会话</button>
    <div id="session-list" class="session-list"></div>
    <div class="sidebar-foot"><span id="sys-clock">--:--:--</span> · SESSIONS</div>
  </aside>

  <div class="main-col">
  <header class="topbar">
    <div class="logo"><span class="shield">⬢</span>OpenGuardian<span class="ver">v0.1.0</span></div>
    <div class="tabs">
      <button id="tab-chat" class="tab active">安全助手</button>
      <button id="tab-dash" class="tab">监控台</button>
    </div>
    <div class="status"><span class="dot"></span><span id="status-text">连接中…</span></div>
  </header>

  <main id="chat" class="chat"></main>

  <main id="dashboard" class="dashboard hidden">
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">高危风险</div><div class="kpi-value" id="kpi-high">0</div></div>
      <div class="kpi"><div class="kpi-label">检测项</div><div class="kpi-value" id="kpi-total">0</div></div>
      <div class="kpi"><div class="kpi-label">处置审计</div><div class="kpi-value" id="kpi-audit">0</div></div>
      <div class="kpi"><div class="kpi-label">检测次数</div><div class="kpi-value" id="kpi-scans">0</div></div>
    </div>
    <div class="dash-grid">
      <div class="panel">
        <h3>风险分布</h3>
        <div id="risk-bars" class="risk-bars"></div>
      </div>
      <div class="panel">
        <h3>资源趋势（最近检测）</h3>
        <svg id="res-chart" viewBox="0 0 400 160" class="res-chart"></svg>
        <div class="legend">
          <span class="lg-cpu">CPU</span>
          <span class="lg-mem">MEM</span>
          <span class="lg-disk">DISK</span>
        </div>
      </div>
      <div class="panel span2">
        <h3>检测历史</h3>
        <div id="scan-list" class="scan-list"></div>
      </div>
    </div>
  </main>

  <footer class="inputbar">
    <input id="input" type="text" placeholder="输入你的问题…（Enter 发送）" autocomplete="off">
    <button id="send">发送</button>
  </footer>
  </div>
</div>

<!-- 处置确认弹窗 -->
<div id="confirm-modal" class="modal hidden">
  <div class="modal-box">
    <h3>⚠️ 确认处置</h3>
    <p id="confirm-text">确定要执行该操作吗？</p>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn-ghost">取消</button>
      <button id="confirm-ok" class="btn-danger">确认执行</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
