<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenGuardian · AI 数字安全助手</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">🛡️ OpenGuardian</div>
    <div class="tabs">
      <button id="tab-chat" class="tab active">💬 安全助手</button>
      <button id="tab-dash" class="tab">📊 安全仪表盘</button>
    </div>
    <div class="status"><span class="dot"></span><span id="status-text">连接中…</span></div>
  </header>

  <main id="chat" class="chat"></main>

  <main id="dashboard" class="dashboard hidden">
    <div class="dash-grid">
      <div class="panel">
        <h3>🔴 风险分布</h3>
        <div id="risk-bars" class="risk-bars"></div>
      </div>
      <div class="panel">
        <h3>📈 资源趋势（最近检测）</h3>
        <svg id="res-chart" viewBox="0 0 400 160" class="res-chart"></svg>
        <div class="legend">
          <span class="lg-cpu">— CPU</span>
          <span class="lg-mem">— 内存</span>
          <span class="lg-disk">— 磁盘</span>
        </div>
      </div>
      <div class="panel span2">
        <h3>🕐 检测历史</h3>
        <div id="scan-list" class="scan-list"></div>
      </div>
    </div>
  </main>

  <footer class="inputbar">
    <input id="input" type="text" placeholder="输入你的问题…（Enter 发送）" autocomplete="off">
    <button id="send">发送</button>
  </footer>
</div>

<!-- 处置确认弹窗 -->
<div id="confirm-modal" class="modal hidden">
  <div class="modal-box">
    <h3>⚠️ 确认处置</h3>
    <p id="confirm-text">确定要执行该操作吗？</p>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn-ghost">取消</button>
      <button id="confirm-ok" class="btn-danger">确认执行</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
