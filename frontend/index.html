<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenGuardian · AI 数字安全平台</title>
  <link rel="icon" href="/static/OpenGuardian.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/style.css?v=0.6.0">
  <script src="/static/icons.js?v=0.6.0" defer></script>
  <script src="/static/background.js?v=0.6.0" defer></script>
  <script src="/static/notifications.js?v=0.6.0" defer></script>
  <script src="/static/app.js?v=0.6.0" defer></script>
  <script src="/static/chart-enhance.js?v=0.6.0" defer></script>
</head>
<body>
<canvas id="bg-canvas" class="bg-canvas"></canvas>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-toggle" id="sidebar-toggle" title="收起侧边栏">◀</button>
    <button id="new-session" class="new-session"><svg class="ic"><use href="#ic-plus"/></svg>新建会话</button>
    <div id="session-list" class="session-list"></div>
    <div class="sidebar-foot"><span id="sys-clock">--:--:--</span> · SESSIONS</div>
  </aside>

  <div class="main-col">
  <header class="topbar">
    <div class="logo"><span class="shield"><svg class="ic"><use href="#ic-shield"/></svg></span>OpenGuardian<span class="ver">v0.6.0</span></div>
    <div class="tabs">
      <button id="tab-chat" class="tab active">安全助手</button>
      <button id="tab-dash" class="tab">监控台</button>
    </div>
    <div class="status"><span class="dot"></span><span id="status-text">连接中…</span></div>
    <button id="btn-settings" class="btn-settings" title="API 设置"><svg class="ic"><use href="#ic-settings"/></svg></button>
  </header>

  <div id="chat-status" class="chat-status"><span class="dot online"></span><span id="provider-name">DeepSeek</span></div>
  <main id="chat" class="chat"></main>

  <main id="dashboard" class="dashboard hidden">
    <div id="status-banner" class="status-banner">
      <span class="sb-icon"><svg class="ic"><use href="#ic-shield"/></svg></span>
      <div class="sb-body">
        <div class="sb-title" id="sb-title">系统状态检测中…</div>
        <div class="sb-sub" id="sb-sub">运行检测后显示整体安全状态</div>
      </div>
      <div class="sb-time" id="sb-time"></div>
    </div>
    <div id="kb-strip" class="kb-strip">
      <span class="kb-ic"><svg class="ic"><use href="#ic-net"/></svg></span>
      <span id="kb-text">威胁情报自动更新检测中…</span>
    </div>
    <div class="security-panel">
      <div class="sec-left">
        <div class="sec-label">电脑安全系数</div>
        <div class="sec-score-row">
          <div class="sec-score" id="sec-score">--</div>
          <div class="sec-grade-wrap">
            <div class="sec-grade" id="sec-grade">待评估</div>
            <div class="sec-sub" id="sec-sub">运行检测后评估</div>
          </div>
        </div>
        <div class="sec-bar"><div class="sec-bar-fill" id="sec-bar-fill" style="width:0%"></div></div>
        <div class="sec-scale"><span>0</span><span>50</span><span>100</span></div>
      </div>
      <div class="sec-right">
        <div class="sec-title">加固方案（照着做就安全）</div>
        <div id="sec-suggestions" class="sec-suggestions"></div>
      </div>
    </div>
    <div class="kpi-row">
      <div class="kpi" id="kpi-card-high">
        <div class="kpi-icon ik-red"><svg class="ic"><use href="#ic-alert"/></svg></div>
        <div class="kpi-mid"><div class="kpi-label">高危风险</div><div class="kpi-value" id="kpi-high">0</div></div>
        <span class="kpi-dot" id="kpi-high-dot"></span>
      </div>
      <div class="kpi">
        <div class="kpi-icon ik-orange"><svg class="ic"><use href="#ic-radar"/></svg></div>
        <div class="kpi-mid"><div class="kpi-label">检测项</div><div class="kpi-value" id="kpi-total">0</div></div>
      </div>
      <div class="kpi">
        <div class="kpi-icon ik-green"><svg class="ic"><use href="#ic-bolt"/></svg></div>
        <div class="kpi-mid"><div class="kpi-label">处置审计</div><div class="kpi-value" id="kpi-audit">0</div></div>
      </div>
      <div class="kpi">
        <div class="kpi-icon ik-cyan"><svg class="ic"><use href="#ic-scan"/></svg></div>
        <div class="kpi-mid"><div class="kpi-label">检测次数</div><div class="kpi-value" id="kpi-scans">0</div></div>
      </div>
      <div class="kpi">
        <div class="kpi-icon ik-mem"><svg class="ic"><use href="#ic-cpu"/></svg></div>
        <div class="kpi-mid"><div class="kpi-label">实时内存</div><div class="kpi-value" id="kpi-mem">--%</div></div>
      </div>
    </div>
    <div class="dash-grid">
      <div class="panel">
        <h3>风险分布明细</h3>
        <div id="risk-bars" class="risk-bars"></div>
      </div>
      <div class="panel">
        <h3>实时资源趋势</h3>
        <svg id="res-chart" viewBox="0 0 400 160" class="res-chart"></svg>
        <div class="legend">
          <span class="lg-cpu">CPU</span>
          <span class="lg-mem">MEM</span>
          <span class="lg-disk">DISK</span>
        </div>
      </div>
      <div class="panel span2">
        <h3>检测历史</h3>
        <div id="scan-list" class="scan-list"></div>
      </div>
    </div>
  </main>

  <footer class="inputbar">
    <input id="input" type="text" placeholder="输入你的问题…（Enter 发送）" autocomplete="off">
    <button id="send">发送</button>
  </footer>
  </div>
</div>

<!-- 处置确认弹窗 -->
<div id="confirm-modal" class="modal hidden">
  <div class="modal-box">
    <h3>确认处置</h3>
    <p id="confirm-text">确定要执行该操作吗？</p>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn-ghost">取消</button>
      <button id="confirm-ok" class="btn-danger">确认执行</button>
    </div>
  </div>
</div>

</body>
</html>
